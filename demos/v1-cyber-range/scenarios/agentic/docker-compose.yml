# Run from the demos/v1-cyber-range project root (see ../../run.sh):
#   docker compose -f core/docker-compose.core.yml -f scenarios/agentic/docker-compose.yml up -d
# The `cyberrange_net` network and `cyberrange_events` volume are declared in
# the core file and merged in automatically. Build contexts below are
# written relative to the project root, not this file's own directory -- see
# scenarios/web-exploit/docker-compose.yml's header comment for why.
#
# juice-shop / proxy / detector are IDENTICAL to scenarios/web-exploit's --
# the target and the (real, independent) detection side don't change for
# this scenario, only who chooses the attacker's actions does (see
# specs/local-llm-agents.md). Rather than duplicate that code, this file
# points their build contexts straight at scenarios/web-exploit/{proxy,detector}
# and reuses the same container names on purpose: switching between
# `./run.sh web-exploit` and `./run.sh agentic` without a reset in between
# leaves these three untouched and only swaps the attacker-side service.

services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    restart: unless-stopped
    networks:
      - cyberrange_net

  proxy:
    build: ./scenarios/web-exploit/proxy
    container_name: range-proxy
    restart: unless-stopped
    depends_on:
      - juice-shop
    networks:
      - cyberrange_net
      - cyberrange_view
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - cyberrange_events:/data
    environment:
      - UPSTREAM=http://juice-shop:3000
      - ACCESS_LOG=/data/access.jsonl
      - PORT=3000

  detector:
    build: ./scenarios/web-exploit/detector
    container_name: range-detector
    restart: unless-stopped
    depends_on:
      - proxy
    networks:
      - cyberrange_net
    volumes:
      - cyberrange_events:/data
    environment:
      - ACCESS_LOG=/data/access.jsonl
      - EVENTS_API=http://range-dashboard:8080/events

  tool-api:
    build:
      context: ./scenarios/agentic
      dockerfile: tool-api/Dockerfile
    container_name: range-tool-api
    restart: unless-stopped
    depends_on:
      - proxy
    networks:
      - cyberrange_net
      - cyberrange_view
    # Published so the host-side brain processes (scenarios/agentic/brain/,
    # NOT containerized -- see specs/architecture.md's "Local LLM runtime")
    # can reach the constrained action menu the same way the presenter's
    # browser already reaches the dashboard: a narrow, published 127.0.0.1
    # port, not a new leg into the isolated network for anything untrusted.
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - cyberrange_events:/data
    environment:
      - TARGET=http://proxy:3000
      - JUICE_SHOP_HOST=juice-shop
      - EVENTS_API=http://range-dashboard:8080/events
      # Same shared volume the dashboard/proxy write to -- read directly for
      # the end-of-run incident report (tool_investigate_incident).
      - EVENTS_LOG_PATH=/data/events.jsonl
      - ACCESS_LOG_PATH=/data/access.jsonl
      - PORT=9000
