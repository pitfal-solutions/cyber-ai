[global]
   workgroup = WORKGROUP
   server string = Corp File Server
   security = user
   map to guest = Bad User
   guest account = nobody
   log file = /logs/smb-%m.log
   log level = 1
   max log size = 1000
   # smbd listens internally on 4450 -- proxy.py (this container's main
   # process) fronts the real 445 and logs every connection independently,
   # same "proxy → real, independent access log" pattern as
   # scenarios/web-exploit/proxy/server.py. Not Samba's own logging: tried
   # several debug-level/vfs_full_audit approaches first and none reliably
   # surfaced a connect-level line on this Samba version's split rpc_host
   # worker architecture -- see specs/network-intrusion.md.
   smb ports = 4450
   # Deliberately weak, real misconfiguration -- a share reachable with no
   # credentials at all, the same class of real-world SMB exposure behind
   # a large share of actual data-breach incidents (T1021.002). Not a
   # simulated finding: this is genuine anonymous SMB access, real
   # smbclient/smbmap tooling against it works exactly as it would in the
   # wild.
   server min protocol = NT1
   client min protocol = NT1

[public]
   path = /srv/public
   browseable = yes
   guest ok = yes
   read only = yes
   guest only = yes
